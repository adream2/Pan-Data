name: check

on:
  schedule:
    - cron: "23 3 * * *"        # 每天 UTC 03:23（北京时间 11:23）
  workflow_dispatch:
    inputs:
      limit:
        description: "本次最多巡检多少条（0 = 全部到期条目）"
        default: "0"
      recheck_days:
        description: "跳过 N 天内查过的"
        default: "7"

permissions:
  contents: write

concurrency:
  group: pan-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore data branch
        run: |
          git fetch --depth 1 origin data || true
          if git rev-parse --verify -q origin/data >/dev/null; then
            git archive origin/data data | tar -x -C "$GITHUB_WORKSPACE"
            echo "已恢复历史数据"
          else
            echo "首次运行，无历史数据"
          fi

      - name: Check links
        env:
          TG_PROXY: ${{ secrets.TG_PROXY }}
        run: |
          python collector/check_links.py \
            --recheck-days "${{ github.event.inputs.recheck_days || '7' }}" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --delay 0.8

      - name: Export contract
        run: python tools/export.py

      - name: Verify
        run: |
          python - <<'PY'
          import json
          idx = json.load(open("data/index.json", encoding="utf-8"))
          print("hot/全量:", json.load(open("data/resources.json", encoding="utf-8"))["counts"], idx["totals"])
          assert idx["totals"]["shards"] >= 1, "分片缺失"
          PY

      - name: Publish data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/datarepo && cd /tmp/datarepo
          git init -q -b data
          mkdir -p data
          cp -r "$GITHUB_WORKSPACE/data/." data/
          rm -f data/*.tmp
          git add -A
          git commit -q -m "data: $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin data
          echo "已发布 ${{ github.server_url }}/${GITHUB_REPOSITORY}/tree/data"
