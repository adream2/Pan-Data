name: check

on:
  schedule:
    - cron: "23 3 * * *"        # 每天 UTC 03:23（北京时间 11:23）
  workflow_dispatch:
    inputs:
      limit:
        description: "本次最多巡检多少条（0 = 全部到期条目）"
        default: "0"
      recheck_days:
        description: "跳过 N 天内查过的"
        default: "7"

permissions:
  contents: write

concurrency:
  group: pan-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore data branch
        run: |
          git fetch --depth 1 origin data || true
          if git rev-parse --verify -q origin/data >/dev/null; then
            mkdir -p data
            git show origin/data:data/links.jsonl   > data/links.jsonl   2>/dev/null || true
            git show origin/data:data/resources.json > data/resources.json 2>/dev/null || true
          fi
          wc -l data/links.jsonl 2>/dev/null || echo "首次运行，无历史数据"

      - name: Check links
        env:
          TG_PROXY: ${{ secrets.TG_PROXY }}
        run: |
          python collector/check_links.py \
            --recheck-days "${{ github.event.inputs.recheck_days || '7' }}" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --delay 0.8

      - name: Export contract
        run: python tools/export.py

      - name: Publish data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/datarepo/data && cd /tmp/datarepo
          git init -q -b data
          cp "$GITHUB_WORKSPACE/data/links.jsonl"   data/links.jsonl
          cp "$GITHUB_WORKSPACE/data/resources.json" data/resources.json
          git add -A
          git commit -q -m "data: $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin data
          echo "已发布 ${{ github.server_url }}/${GITHUB_REPOSITORY}/tree/data"
