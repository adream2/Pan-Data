name: mtproto

on:
  schedule:
    - cron: "*/15 * * * *"      # 每 15 分钟追一次新消息（账号直连，秒级）
  workflow_dispatch:
    inputs:
      limit:
        description: "每个频道最多拉多少条历史（0 = 只取新消息）"
        default: "0"
      channels:
        description: "临时频道，逗号分隔（留空则读 channels.txt）"
        default: ""

permissions:
  contents: write

# 与 collect / backfill 共用同一把锁：都会重写 links.jsonl 并整树发布，必须串行
concurrency:
  group: pan-data
  cancel-in-progress: false

jobs:
  mtproto:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard (未配置 session 就跳过，避免每 15 分钟报红)
        id: guard
        env:
          SESSION: ${{ secrets.TG_SESSION }}
        run: |
          if [ -z "$SESSION" ]; then
            echo "::notice::未配置 TG_SESSION，跳过 MTProto 采集（见 README「MTProto 冲量」）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore data branch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git fetch --depth 1 origin data || true
          if git rev-parse --verify -q origin/data >/dev/null; then
            git archive origin/data data | tar -x -C "$GITHUB_WORKSPACE"
            echo "已恢复历史数据"
          else
            echo "首次运行，无历史数据"
          fi

      - name: Install telethon
        if: steps.guard.outputs.skip != 'true'
        run: pip install --quiet telethon

      - name: Collect via MTProto
        if: steps.guard.outputs.skip != 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python collector/tg_mtproto.py \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --channels "${{ github.event.inputs.channels }}"

      - name: Export contract
        if: steps.guard.outputs.skip != 'true'
        run: python tools/export.py

      - name: Publish data branch
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/datarepo && cd /tmp/datarepo
          git init -q -b data
          mkdir -p data
          cp -r "$GITHUB_WORKSPACE/data/." data/
          rm -f data/*.tmp
          git add -A
          git commit -q -m "data: mtproto $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin data
          echo "已发布 ${{ github.server_url }}/${GITHUB_REPOSITORY}/tree/data"
