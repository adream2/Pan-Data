name: collect

on:
  schedule:
    - cron: "7,37 * * * *"      # 每 30 分钟；避开整点
  workflow_dispatch:
    inputs:
      pages:
        description: "每个频道回溯页数（首次建库填 20）"
        default: "1"
      channels:
        description: "临时频道，逗号分隔（留空则读 channels.txt）"
        default: ""

permissions:
  contents: write

concurrency:
  group: pan-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore data branch
        run: |
          git fetch --depth 1 origin data || true
          if git rev-parse --verify -q origin/data >/dev/null; then
            git archive origin/data data | tar -x -C "$GITHUB_WORKSPACE"
            python tools/pack_links.py --join      # 明细按月压缩存储，先拼回单文件
            echo "已恢复历史数据"
            du -sh data || true
          else
            echo "首次运行，无历史数据"
          fi

      - name: Collect
        env:
          TG_PROXY: ${{ secrets.TG_PROXY }}
        run: |
          python collector/fetch_tg.py \
            --pages "${{ github.event.inputs.pages || '1' }}" \
            --channels "${{ github.event.inputs.channels }}" \
            --sleep 1.5

      - name: Export contract
        run: python tools/export.py

      - name: Verify
        run: |
          python - <<'PY'
          import json
          idx = json.load(open("data/index.json", encoding="utf-8"))
          d = json.load(open("data/resources.json", encoding="utf-8"))
          assert d["schema_version"].startswith("1."), "schema 版本不符"
          assert d["counts"]["resources"] > 0, "热文件为空"
          assert d["counts"]["window_days"] > 0, "缺少时间窗，文件会无限膨胀"
          assert idx["totals"]["shards"] >= 1, "分片缺失"
          print("hot:", d["counts"]["resources"], "| 全量:", idx["totals"])
          PY

      - name: Publish data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 明细按月切块 + gzip：单文件永不逼近 100MB 硬限
          python tools/pack_links.py --split
          mkdir -p /tmp/datarepo && cd /tmp/datarepo
          git init -q -b data
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 以远端 data 分支为基线，只推变化的对象（原先每次 git init 全量重传）
          git fetch -q --depth 1 origin data || true
          if git rev-parse -q --verify FETCH_HEAD >/dev/null; then git reset -q --hard FETCH_HEAD; fi
          rm -rf data && cp -r "$GITHUB_WORKSPACE/data" data
          rm -f data/*.tmp
          # 兜底护栏：有文件超过 95MB 就直接红，别等 GitHub 拒
          python "$GITHUB_WORKSPACE/tools/pack_links.py" --check --root /tmp/datarepo
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过推送"
            exit 0
          fi
          git commit -q -m "data: $(date -u +%FT%TZ)"
          git push origin data || { echo "推送被拒，改强制覆盖"; git push -f origin data; }
          echo "已发布 ${{ github.server_url }}/${GITHUB_REPOSITORY}/tree/data"
